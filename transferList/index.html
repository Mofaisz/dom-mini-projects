<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transfer list</title>
    <link rel="stylesheet" href="./style.css">
    
</head>
<body>
    <header>
        <div class="header">
            <h3>Transfer List</h3>
        </div>
    </header>
    <div class="body-grid">
    <section>

        <div id  = "first-column" class="main">
            <div class = "first-list">
                <input class="checkboxes" type="checkbox">
            <label>JS</label>
            </div>
            <div class = "first-list">
                <input class="checkboxes" type="checkbox">
            <label>HTML</label>
            </div>
            <div class = "first-list">
                <input class="checkboxes" type="checkbox">
            <label>CSS</label>
            </div>
            <div class = "first-list">
                <input class="checkboxes" type="checkbox">
            <label>TS</label>
            </div>
           
        </div>

        <div class="buttons">
            <button type="button" id="all-item-left" class="transfer-button"><<</button>
            <button type="button" id="one-item-left" class="transfer-button"><</button>
            <button type="button" id="one-item-right" class="transfer-button">></button>
            <button type="button" id="all-item-right" class="transfer-button">>></button>
        </div>

        <div class = "last-column" id="side">
            <div class="last-list">
                <input class="checkboxes" type="checkbox">
                <label>React</label>
            </div>
            <div class="last-list">
                <input class="checkboxes" type="checkbox">
            <label>Angular</label>
            </div>
            <div class="last-list">
                <input class="checkboxes" type="checkbox">
            <label>vue</label>
            </div>
            <div class="last-list">
                <input class="checkboxes" type="checkbox">
            <label>Svelte</label>
            </div>
            
        </div>

    </section>
</div>
    <script src = "./script.js"></script>
</body>
</html>
